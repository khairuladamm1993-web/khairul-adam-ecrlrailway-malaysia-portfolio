name: MR-S10 P01 Unified V6 isolated integration QA
on:
  push:
    branches: [feature/mrs10-p01-unified-v6-sri-mono-erl-isolated]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - name: Legacy and V4 V5 V6 regression
        run: |
          npm test
          node --test tests/unified-v4-gis.test.cjs tests/unified-v5-regression.test.cjs tests/unified-v6-regression.test.cjs
      - name: Map source syntax
        run: |
          node --check assets/unified-v6-map.js
          node --check assets/unified-v6/adapter.js
          node --check scripts/build-unified-v6.cjs
      - name: Live Monorail ArcGIS layer5 source reconciliation
        run: |
          node - <<'NODE'
          (async()=>{
           const mono=require('./assets/unified-v6/monorail-registry.js');
           const adapter=require('./assets/unified-v6/adapter.js');
           const route='https://services5.arcgis.com/2ZRAaoTSJbQ20ceg/arcgis/rest/services/SELANGOR_RAILWAY_MAP/FeatureServer/5/query?where=1%3D1&outFields=*&returnGeometry=true&outSR=4326&f=json';
           const response=await fetch(route);if(!response.ok)throw Error('GIS_HTTP_'+response.status);
           const raw=await response.json();
           const data=adapter.decodeMonorailArcGIS(raw.features,mono);
           console.log('MONORAIL_LAYER5_GIS_AUDIT',JSON.stringify({count:raw.features?.length,matched:data.matched,rejected:data.rejected,
            names:raw.features?.map(f=>[f.attributes?.STN_NAME,f.attributes?.STN_CODE])}));
           if(data.matched!==11)process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: V6 safe build
        run: |
          node scripts/build-unified-v6.cjs
          test -f dist-unified-v6/unified-map-v6.html
          test ! -e dist-unified-v6/assets/member-gateway.js
          grep -q 'overpass.kumi.systems' dist-unified-v6/_headers
      - uses: actions/upload-artifact@v4
        with:
          name: v6-public-only-audit
          path: dist-unified-v6/
          retention-days: 3

  browser:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit
      - run: |
          which google-chrome
          npm install --no-save --ignore-scripts playwright@1.56.1 pngjs@7.0.0
      - name: V6 actual browser visual test
        run: node tests/unified-v6-browser.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v6-browser-screenshots-and-results
          path: artifacts/unified-v6-browser/
          retention-days: 3
