name: P01 Protected Preview Package
on:
  push:
    branches: [candidate/p01-preview-blocker-resolution-v1-20261123, candidate/p01-visual-refinement-mrnext-20261124, candidate/p01-public-ecosystem-nav-001-20261125, candidate/p01-ecrl-integration-batch-20261125, candidate/p01-shared-core-identity-20261125]
permissions:
  contents: read
jobs:
  preview-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify no-deployment policy
        run: node -e 'require("node:assert/strict").equal(require("./vercel.json").git.deploymentEnabled[process.env.GITHUB_REF_NAME], false)'
      - name: Build isolated Protected Preview package
        env:
          P01_EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/build-p01-protected-preview.cjs "$RUNNER_TEMP/p01-protected-preview"
      - name: Verify Preview package and gateway contracts
        run: |
          P01_PREVIEW_PACKAGE="$RUNNER_TEMP/p01-protected-preview" node --test tests/p01-protected-preview-package.test.cjs
          node --test tests/p01-member-public-map-contract.test.cjs tests/p01-role-map-integration.test.cjs tests/p01-role-map-runtime.test.cjs tests/p01-ecrl-data-contract.test.cjs
      - name: Archive verified prebuilt Preview bundle
        if: github.ref_name == 'candidate/p01-visual-refinement-mrnext-20261124' || github.ref_name == 'candidate/p01-public-ecosystem-nav-001-20261125' || github.ref_name == 'candidate/p01-ecrl-integration-batch-20261125' || github.ref_name == 'candidate/p01-shared-core-identity-20261125'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-prebuilt-${{ github.sha }}
          path: ${{ runner.temp }}/p01-protected-preview/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
