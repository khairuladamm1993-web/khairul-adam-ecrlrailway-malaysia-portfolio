name: P01 D102 R1.6 event-driven journey control & layouts
on:
  push:
    branches:
      - feature/mrs10-p01-d102-event-driven-journey-r16-20261030
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit
      - name: New journey transitions and prior regression
        run: |
          node --check assets/unified-ecrl/route-lab-d102-journey-control.js
          node --check assets/unified-ecrl/route-lab-imported-layouts.js
          node --check assets/unified-ecrl/route-lab-d102-journey-ui.js
          node --check assets/unified-ecrl/route-lab-ui.js
          node --test tests/unified-ecrl-d102-journey-r16.test.cjs tests/unified-ecrl-d102-camera.test.cjs tests/unified-ecrl-d102-preflight.test.cjs tests/unified-ecrl-hd-imagery.test.cjs
      - run: node scripts/build-unified-v8.cjs
      - run: test -f dist-unified-v8/ecrl-alignment-lab.html
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit
      - run: node scripts/build-unified-v8.cjs
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps webkit
      - name: End-to-end 6-viewport D102 departure QZ station layout restart proof
        run: |
          python3 -m http.server 8765 --directory dist-unified-v8 >/tmp/p01-d102-r16.log 2>&1 &
          node tests/unified-ecrl-d102-journey-r16-browser.test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: d102-r16-journey-browser-qa
          path: artifacts/d102-r16/
          retention-days: 14
