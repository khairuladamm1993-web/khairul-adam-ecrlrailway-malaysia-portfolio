name: MR-S10 P01 Unified V8 Singapore Geometry QA
on:
  push:
    branches: [feature/mrs10-p01-unified-v8-singapore-geometry-20261027]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit
      - run: npm test
      - run: node --test tests/unified-v6-regression.test.cjs tests/unified-v7-regression.test.cjs tests/unified-v8-regression.test.cjs
      - run: node scripts/audit-unified-v8-networks.cjs
      - run: node scripts/build-unified-v8.cjs
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps webkit
      - name: Browser QA of exact checkout build
        run: |
          python3 -m http.server 8765 --directory dist-unified-v8 > /tmp/v8-server.log 2>&1 &
          node tests/unified-v8-browser.test.mjs
      - name: Verify immutable deployed preview in Chromium and WebKit
        env:
          V8_URL: https://mrs10-p01-unified-v8-sg-geometry-4sjirdqsh-1993khairuladam-3016.vercel.app/unified-map-v8.html
        run: |
          mv artifacts/unified-v8-browser artifacts/unified-v8-local-browser
          node tests/unified-v8-browser.test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unified-v8-browser-evidence
          path: artifacts/unified-v8*browser/
          retention-days: 7
