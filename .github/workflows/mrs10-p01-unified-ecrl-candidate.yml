name: MR-S10 P01 ECRL integration candidate QA
on:
  push:
    branches: [feature/mrs10-p01-v81-ecrl-consumer-candidate-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated-map:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit
      - run: node --test tests/unified-ecrl-foundation.test.cjs tests/unified-v81-focus.test.cjs
      - run: node scripts/build-unified-v8.cjs
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps webkit
      - name: Verify immutable staging files
        if: contains(github.event.head_commit.message, '[preview-verification]')
        run: node tests/unified-ecrl-deployment.test.mjs
      - name: ECRL canvas and consumer foundation QA
        env:
          V8_URL: ${{ contains(github.event.head_commit.message, '[preview-verification]') && 'https://mrs10-p01-unified-v8-sg-geometry-2xx50vmky-1993khairuladam-3016.vercel.app/unified-map-v8.html' || '' }}
        run: |
          python3 -m http.server 8765 --directory dist-unified-v8 > /tmp/ecrl-candidate-server.log 2>&1 &
          node tests/unified-ecrl-browser.test.mjs
      - name: Isolated WebKit iPad legacy capture verification
        if: contains(github.event.head_commit.message, '[preview-verification]')
        env:
          V8_URL: https://mrs10-p01-unified-v8-sg-geometry-2xx50vmky-1993khairuladam-3016.vercel.app/unified-map-v8.html
          V8_QA_ENGINES: webkit
          V8_QA_VIEWPORTS: ipad
        run: node tests/unified-v8-browser.test.mjs
      - name: V8.1 map-first regression
        if: "!contains(github.event.head_commit.message, '[preview-verification]')"
        run: node tests/unified-v81-browser.test.mjs
      - name: Full Malaysia and Singapore regression
        if: "!contains(github.event.head_commit.message, '[preview-verification]')"
        run: |
          npm test
          node --test tests/unified-v6-regression.test.cjs tests/unified-v7-regression.test.cjs tests/unified-v8-regression.test.cjs
          node scripts/audit-unified-v8-networks.cjs
          node tests/unified-v8-browser.test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unified-ecrl-candidate-evidence
          path: |
            artifacts/unified-ecrl-browser/
            artifacts/unified-ecrl-deployment/
            artifacts/unified-v8*browser/
          retention-days: 14
