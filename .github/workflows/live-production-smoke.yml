          grep -q "if(!mounted||!A.canAdmin)return" /tmp/live-assets_owner-map.js
          grep -q "rpc('admin_publish_location'" /tmp/live-assets_access.js
          grep -q "rpc('admin_location_history'" /tmp/live-assets_access.js
          grep -q "rpc('admin_restore_location'" /tmp/live-assets_access.js
          curl -fsSL --retry 4 --retry-delay 2 "${BASE}assets/member-gateway.js" -o /tmp/live-assets_member-gateway.js
          grep -Fq "const escape=v=>R.escape(String(v??''));" /tmp/live-assets_member-gateway.js
          ! grep -Fq "const escape=v=>h(String(v??''));" /tmp/live-assets_member-gateway.js
          grep -Fq 'data-member-module="'+escape(id)+'"' /tmp/live-assets_member-gateway.js
          grep -Fq 'aria-pressed="'+selected.has(id)+'"' /tmp/live-assets_member-gateway.js
          echo 'Live byte parity, Member renderer fix, GEMAC correction, protected-path and Admin-gate scan: PASS'

      - name: Public fail-closed MAP and responsive browser smoke
        shell: bash
        run: |
          node <<'NODE'
          (async()=>{
          const fs=require('fs'),{spawn,spawnSync}=require('child_process');
          const BASE='https://khairuladamm1993-web.github.io/khairul-adam-ecrlrailway-malaysia-portfolio/';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          function findChrome(){for(const bin of ['google-chrome','google-chrome-stable','chromium','chromium-browser']){const r=spawnSync('which',[bin],{encoding:'utf8'});if(r.status===0)return r.stdout.trim();}throw new Error('Chrome/Chromium not found');}
          const profile=fs.mkdtempSync('/tmp/live-pages-chrome-');
          const chrome=spawn(findChrome(),['--headless=new','--no-sandbox','--disable-gpu','--remote-debugging-address=127.0.0.1','--remote-debugging-port=0','--user-data-dir='+profile,'about:blank'],{stdio:['ignore','ignore','pipe']});
          let stderr='';
          const browserWs=new Promise((resolve,reject)=>{chrome.stderr.setEncoding('utf8');chrome.stderr.on('data',chunk=>{stderr+=chunk;const m=stderr.match(/DevTools listening on (ws:\/\/[^\s]+)/);if(m)resolve(m[1]);});chrome.once('exit',code=>reject(new Error('Chrome exited '+code+' '+stderr.slice(-1000))));});
          const wsUrl=await Promise.race([browserWs,new Promise((_,rej)=>setTimeout(()=>rej(new Error('CDP timeout '+stderr.slice(-1000))),15000))]);
          const port=new URL(wsUrl).port;
          let pageInfo;
          for(let i=0;i<50;i++){
            try{
              const r=await fetch('http://127.0.0.1:'+port+'/json/list');
              const a=await r.json();
              pageInfo=a.find(x=>x.type==='page'&&(x.url==='about:blank'||x.url.startsWith('http')));
              if(pageInfo)break;
            }catch{}
            await sleep(100);
          }
          if(!pageInfo)throw new Error('No CDP page');
          const ws=new WebSocket(pageInfo.webSocketDebuggerUrl);
          await new Promise((res,rej)=>{ws.addEventListener('open',res,{once:true});ws.addEventListener('error',rej,{once:true});});
          let id=1;const pending=new Map();
          ws.addEventListener('message',e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(m.error.message)):p.resolve(m.result);}});
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=id++;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));});
          const ev=async expression=>{
            const r=await send('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true});
            if(r.exceptionDetails){
              const detail={expression,text:r.exceptionDetails.text,description:r.exceptionDetails.exception&&r.exceptionDetails.exception.description,line:r.exceptionDetails.lineNumber,column:r.exceptionDetails.columnNumber};
              throw new Error('CDP eval failed '+JSON.stringify(detail));
            }
            return r.result&&r.result.value;
          };
          async function wait(expression,timeout=12000){
            const start=Date.now();
            while(Date.now()-start<timeout){if(await ev(expression))return;await sleep(120);}
            const diag=await ev("({href:location.href,title:document.title,ready:document.readyState,body:(document.body&&document.body.innerText||'').slice(0,500),scripts:[...document.scripts].map(s=>s.src||'inline')})");
            throw new Error('wait timeout '+expression+' '+JSON.stringify(diag));
          }
          await send('Page.enable');await send('Runtime.enable');
          for(const pair of [[390,844],[768,1024],[1440,900]]){
            const width=pair[0],height=pair[1];
            await send('Emulation.setDeviceMetricsOverride',{width,height,deviceScaleFactor:1,mobile:width<700});
            await send('Page.navigate',{url:BASE+'gateway.html?liveSmoke='+Date.now()});
            await wait("location.href.includes('/gateway.html')");
            await wait("document.readyState==='complete'");
            await wait("!!document.querySelector('#categories [data-category=\"map\"]')");
            await wait("window.RailwayAccess && window.RailwayAccess.status!=='initializing'");
            const initial=await ev("(()=>({overflow:document.documentElement.scrollWidth-innerWidth,order:[...document.querySelectorAll('#categories [data-category]')].map(x=>x.dataset.category).join(','),level:window.RailwayAccess&&window.RailwayAccess.level,canAdmin:window.RailwayAccess&&window.RailwayAccess.canAdmin,canRead:window.RailwayAccess&&window.RailwayAccess.canReadMemberContent,login:/magic link|member access|secure sign-in/i.test(document.body.innerText),owner:!!document.querySelector('[data-owner-map-slot]')||/EDIT LOCATION|MY CURRENT LOCATION/.test(document.body.innerText),mapScript:!!document.querySelector('script[data-railway-map-module]')}))()");
            if(initial.overflow>2)throw new Error('overflow '+width+' '+initial.overflow);
            if(initial.order!=='practical,ebook,corridor,map,future,news')throw new Error('gateway order '+initial.order);
            if(initial.level!=='public'||initial.canAdmin!==false||initial.canRead!==false)throw new Error('fail-closed boundary '+JSON.stringify(initial));
            if(!initial.login)throw new Error('Member login entry missing');
            if(initial.owner)throw new Error('Owner controls exposed publicly');
            if(initial.mapScript)throw new Error('MAP loaded before selection');
            await ev("document.querySelector('#categories [data-category=\"map\"]').click();true");
            await wait("!!document.querySelector('script[data-railway-map-module]')");
            await wait("document.querySelector('#railway-map-mount')&&document.querySelector('#railway-map-mount').dataset.mapReady==='true'",15000);
            const mapped=await ev("(()=>({overflow:document.documentElement.scrollWidth-innerWidth,mapScript:!!document.querySelector('script[data-railway-map-module]'),ownerScript:!!document.querySelector('script[data-railway-owner-map]'),owner:/EDIT LOCATION|MY CURRENT LOCATION/.test(document.body.innerText),markerCount:document.querySelectorAll('.leaflet-marker-icon').length,noPolyline:document.body.innerText.includes('No route line / no polyline')}))()");
            if(mapped.overflow>2||!mapped.mapScript||mapped.ownerScript||mapped.owner||mapped.markerCount<1||!mapped.noPolyline)throw new Error('MAP live smoke '+width+' '+JSON.stringify(mapped));
            await ev("document.querySelector('#categories [data-category=\"corridor\"]').click();true");
            await wait("window.RailwayMap&&window.RailwayMap.mounted===false");
            console.log('PASS live viewport '+width+'x'+height);
          }
          ws.close();chrome.kill('SIGTERM');
          console.log('Live Public/Member-entry/Admin-boundary/MAP responsive smoke: PASS');
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE
