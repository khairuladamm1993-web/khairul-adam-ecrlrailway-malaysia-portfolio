          EOF
          while read -r expected path; do
            out="/tmp/live-$(echo "$path" | tr '/' '_')"
            curl -fsSL --retry 4 --retry-delay 2 "${BASE}${path}" -o "$out"
            actual=$(sha256sum "$out" | awk '{print $1}')
            test "$actual" = "$expected" || { echo "HASH FAIL $path $actual"; exit 1; }
          done </tmp/expected.sha256
          for path in assets/questions.js assets/gateway.js assets/quiz-core.js package.json README.md tests/production-artifact.test.cjs supabase/migrations/20261007_owner_map_location_management.sql; do
            code=$(curl -sSL -o /tmp/probe -w '%{http_code}' "${BASE}${path}")
            test "$code" = 404 || { echo "FORBIDDEN PATH EXPOSED $path HTTP $code"; exit 1; }
          done
          grep -q 'GEMAC Engineering Machinery Co., Ltd.' /tmp/live-references.html
          grep -q '金鹰重型工程机械股份有限公司' /tmp/live-references.html
          ! grep -q 'GEMAX' /tmp/live-references.html
