name: P01 Three Railway Integrations
on:
  push:
    branches: [integration/mrs10-p01-v81-rc-20261101, feature/mrs10-p01-v81-three-railways-20261101]
    paths-ignore: ['docs/**']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit
      - run: npm test
      - name: Source, privacy and full map/ECRL regression
        run: |
          node scripts/build-unified-v8.cjs
          node --test tests/three-railways.test.cjs tests/unified-ecrl*.test.cjs tests/unified-v6-regression.test.cjs tests/unified-v7-regression.test.cjs tests/unified-v8-regression.test.cjs tests/unified-v81-focus.test.cjs
          node scripts/audit-unified-v8-networks.cjs
  browser:
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        suite: [unified-v8, unified-v81, unified-ecrl, three-railways]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit
      - run: node scripts/build-unified-v8.cjs
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps webkit
      - name: Native canvas interaction QA on independent browser runner
        run: |
          python3 -m http.server 8765 --directory dist-unified-v8 >/tmp/three-railways-server.log 2>&1 &
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:8765/unified-map-v8.html >/dev/null
          node tests/${{ matrix.suite }}-browser.test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: three-railways-qa-${{ matrix.suite }}
          path: artifacts/${{ matrix.suite }}-browser/
          retention-days: 1
