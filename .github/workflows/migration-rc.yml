name: Migration RC validation

on:
  push:
    branches:
      - migration/full-portfolio
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked test dependencies
        run: npm ci
      - name: Run portfolio test suite
        run: npm test
      - name: Build production artifact
        run: npm run build:production
      - name: Smoke production artifact in Chromium
        run: npm run smoke:production
      - name: Validate artifact builders
        run: python3 -m py_compile scripts/build-production.py scripts/build-preview.py
      - name: Upload production candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: railway-production-candidate
          path: dist-production/
          if-no-files-found: error
          retention-days: 7
