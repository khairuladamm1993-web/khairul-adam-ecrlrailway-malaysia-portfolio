name: KTM Komuter V2 isolated QA
on:
  push:
    branches:
      - feature/mrs10-p01-ktm-komuter-v2
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm test
      - run: node --test tests/r223-ktm-komuter-v2.test.cjs
