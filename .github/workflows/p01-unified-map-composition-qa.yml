name: P01 Unified Map Composition QA
on:
  push:
    branches: [candidate/p01-unified-map-composition-20261125]
permissions:
  contents: read
  actions: read
jobs:
  verified-prebuilt-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
    defaults:
      run:
        shell: bash
    env:
      PRODUCT_SHA: 887f59174336272578a57ad9b8ba1e2aefbe838e
      BASELINE_SHA: fc148cc35b7bceb4fd4b328386729d2066694cb8
      BASELINE_ARTIFACT: '15016991693'
      BASELINE_ARCHIVE_HASH: f73f286bbf55fdcbd0999f4e1039c0450be41b5ebc39c53390fc84db7f0681ea
      PACKAGE_MANIFEST_HASH: 5333c56c65e1c5944e2a53a2289bfe0fbf91c898d8b669f0edf1b8c82a8b7754
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify candidate lineage and disable Git deployment
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD^)" = "$PRODUCT_SHA"
          node -e 'require("node:assert/strict").equal(require("./vercel.json").git.deploymentEnabled[process.env.GITHUB_REF_NAME], false)'
          git checkout --detach "$PRODUCT_SHA"
      - name: Download and verify immutable baseline archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/p01-baseline.zip"
          curl --fail --silent --show-error --location --retry 2 \
            --header "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$BASELINE_ARTIFACT/zip" \
            --output "$archive"
          echo "$BASELINE_ARCHIVE_HASH  $archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/p01-package"
      - name: Match every byte to the approved prebuilt manifest without a build
        run: |
          export P01_PREVIEW_PACKAGE="$RUNNER_TEMP/p01-package"
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { createHash } = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.env.P01_PREVIEW_PACKAGE;
          const staticPath = '.vercel/output/static/';
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          const manifestPath = path.join(root, 'release-manifest.json');
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          assert.equal(manifest.sourceSha, process.env.BASELINE_SHA);
          for (const row of manifest.files) {
            assert.equal(hash(fs.readFileSync(path.join(root, row.path))), row.sha256);
          }
          for (const file of ['unified-map-v7.html', 'assets/unified-v7-map.js', 'assets/p01-public-map-nav.css']) {
            fs.copyFileSync(file, path.join(root, staticPath, file));
          }
          const stampPath = path.join(root, staticPath, 'assets/build-info.js');
          const stamp = fs.readFileSync(stampPath, 'utf8')
            .replace(process.env.BASELINE_SHA, process.env.PRODUCT_SHA)
            .replace('2026-11-25T11:21:04.172387Z', '2026-11-25T11:32:57.232995Z');
          fs.writeFileSync(stampPath, stamp);
          manifest.sourceSha = process.env.PRODUCT_SHA;
          for (const row of manifest.files) {
            row.sha256 = hash(fs.readFileSync(path.join(root, row.path)));
          }
          const bytes = JSON.stringify(manifest, null, 2) + '\n';
          assert.equal(hash(bytes), process.env.PACKAGE_MANIFEST_HASH);
          fs.writeFileSync(manifestPath, bytes);
          console.log('P01_APPROVED_PREBUILT_MATCH', manifest.sourceSha, manifest.files.length);
          NODE
          node --test tests/p01-protected-preview-package.test.cjs
      - name: Run Public, Member, ECRL and R211 regression
        run: |
          npm ci --ignore-scripts
          node --test tests/p01-ecrl-data-contract.test.cjs tests/p01-member-public-map-contract.test.cjs tests/p01-role-map-runtime.test.cjs tests/p01-role-map-integration.test.cjs tests/r211-mobile-map-ux.test.cjs
      - name: Run composition QA in MapLibre, Chromium and WebKit
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          vendor="$RUNNER_TEMP/p01-maplibre"
          mkdir -p "$vendor"
          curl --fail --silent --show-error --location --retry 2 https://registry.npmjs.org/maplibre-gl/-/maplibre-gl-6.13.0.tgz --output "$vendor/maplibre-gl.tgz"
          echo "10b5e4e21fb197451115012755b00de8c1a7eb53fa8eae1a9945878ac90b56cbc709a29d7f566ae86f1434e0f4010dd4697a0be4409cf28bf3f32a9810118f2b  $vendor/maplibre-gl.tgz" | sha512sum --check
          checksums="$GITHUB_WORKSPACE/tests/fixtures/p01-maplibre-6.13.0.sha256"
          while read -r digest filename; do
            tar -xzOf "$vendor/maplibre-gl.tgz" "package/dist/$filename" > "$vendor/$filename"
          done < "$checksums"
          (cd "$vendor" && sha256sum --check "$checksums")
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/p01-package/.vercel/output/static" > "$RUNNER_TEMP/p01-visual-http.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          curl --fail --silent --retry 4 --retry-connrefused --output /dev/null http://127.0.0.1:8765/unified-map-v7.html
          P01_QA_MAP_COMPOSITION_ONLY=1 P01_MAPLIBRE_DIST="$vendor" node tests/p01-technology-integration-browser.test.mjs
      - name: Archive browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-unified-map-composition-browser-qa
          path: artifacts/p01-technology-integration/
          retention-days: 14
