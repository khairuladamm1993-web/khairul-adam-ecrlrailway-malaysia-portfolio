name: P01 ECRL Geographic Asset QA
on:
  push:
    branches:
      - candidate/p01-geographic-asset-integration-20261126
      - candidate/p01-r57-pl-alignment-20261127
      - candidate/p01-v7-identity-recovery-20261127
      - candidate/p01-ecrl-asset-map-handoff-20261127
      - candidate/p01-ecrl-catalogue-retry-20261127
      - candidate/p01-ecrl-reference-roundtrip-20261127
      - candidate/p01-ecrl-gateway-continuity-20261127
      - candidate/p01-member-auth-recovery-20261127
      - candidate/p01-ecrl-segment-evidence-20261127
      - candidate/p01-ecrl-integration-recovery-20261128
permissions:
  contents: read
  actions: read
jobs:
  verified-prebuilt-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
    defaults:
      run:
        shell: bash
    env:
      BASELINE_SHA: fc148cc35b7bceb4fd4b328386729d2066694cb8
      BASELINE_ARTIFACT: '15016991693'
      BASELINE_ARCHIVE_HASH: f73f286bbf55fdcbd0999f4e1039c0450be41b5ebc39c53390fc84db7f0681ea
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 20
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify candidate checkout and Git deployment guard
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node -e 'require("node:assert/strict").equal(require("./vercel.json").git.deploymentEnabled[process.env.GITHUB_REF_NAME], false)'
      - name: Resolve exact runtime SHA for prebuilt archive continuation
        if: github.ref_name != 'candidate/p01-ecrl-integration-recovery-20261128'
        run: |
          set -euo pipefail
          source="$GITHUB_SHA"
          if [[ "$(git rev-parse HEAD^)" == 'd3bff72bc189100a8da556f797cc7e95246152b3' ]] &&
             [[ "$(git diff --name-only HEAD^ HEAD)" == '.github/workflows/p01-unified-map-composition-qa.yml' ]] &&
             [[ "$GITHUB_REF_NAME" == 'candidate/p01-ecrl-segment-evidence-20261127' ]]; then
            source='d3bff72bc189100a8da556f797cc7e95246152b3'
            git checkout --detach "$source"
          fi
          test "$(git rev-parse HEAD)" = "$source"
          printf 'P01_PACKAGE_SHA=%s\n' "$source" >> "$GITHUB_ENV"
          printf 'P01_PACKAGE_SOURCE=%s\n' "$source"
      - name: Download and verify immutable baseline archive
        if: github.ref_name != 'candidate/p01-ecrl-integration-recovery-20261128'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/p01-baseline.zip"
          curl --fail --silent --show-error --location --retry 2 \
            --header "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$BASELINE_ARTIFACT/zip" \
            --output "$archive"
          echo "$BASELINE_ARCHIVE_HASH  $archive" | sha256sum --check
          python3 -m zipfile -e "$archive" "$RUNNER_TEMP/p01-package"
      - name: Overlay candidate sources and Public projection on the verified QA fixture
        if: github.ref_name != 'candidate/p01-ecrl-integration-recovery-20261128'
        run: |
          export P01_PREVIEW_PACKAGE="$RUNNER_TEMP/p01-package"
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { createHash } = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const vm = require('node:vm');
          const core = require('./assets/p01-map-core.js');
          const root = process.env.P01_PREVIEW_PACKAGE;
          const staticPath = '.vercel/output/static/';
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          const manifestPath = path.join(root, 'release-manifest.json');
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          assert.equal(manifest.sourceSha, process.env.BASELINE_SHA);
          for (const row of manifest.files) {
            assert.equal(hash(fs.readFileSync(path.join(root, row.path))), row.sha256);
          }
          for (const file of [
            'unified-map-v7.html', 'assets/unified-v7-map.js', 'assets/p01-public-map-nav.css', 'assets/p01-map-core.js',
            'unified-map-v8.html', 'assets/unified-v8-map.js', 'assets/public-gateway.js',
            'assets/access.js', 'assets/member-gateway.js',
            'ecrl-asset-reference.html', 'assets/p01-ecrl-public-reference.js', 'data/ecrl-reference-alignment.geojson',
            'assets/unified-ecrl/adapter.js', 'assets/unified-ecrl/chainage-manifest.js',
            'assets/unified-ecrl/railway-data-contract-v1.js', 'assets/unified-ecrl/alignment-evidence-r2.js',
            'assets/unified-ecrl/route-lab-d102-preflight.js', 'assets/unified-ecrl/route-lab-station-intelligence.js'
          ]) {
            fs.copyFileSync(file, path.join(root, staticPath, file));
          }
          const ecrlRuntime = {
            MRS10UnifiedECRL: require('./assets/unified-ecrl/adapter.js'),
            MRS10ECRLMasterIntelligence: require('./assets/unified-ecrl/master-intelligence.js'),
            MRS10RailwayDataContractV1: require('./assets/unified-ecrl/railway-data-contract-v1.js')
          };
          for (const file of ['data.js', 'i18n.js']) {
            vm.runInNewContext(fs.readFileSync('assets/unified-ecrl/source/' + file, 'utf8'), {window:ecrlRuntime});
          }
          const {dataContract,adapter} = core.createEcrlContext(ecrlRuntime);
          const {version,corridor} = dataContract;
          const records = core.publicAssetIdentity(dataContract,adapter);
          assert.equal(records.length, 32);
          fs.writeFileSync(path.join(root, staticPath, 'data/ecrl-public-identity-v1.json'),
            JSON.stringify({version,corridor,records}, null, 2) + '\n');
          fs.copyFileSync('vercel.json', path.join(root, 'vercel.json'));
          const stampPath = path.join(root, staticPath, 'assets/build-info.js');
          const stamp = fs.readFileSync(stampPath, 'utf8')
            .replace(process.env.BASELINE_SHA, process.env.P01_PACKAGE_SHA);
          fs.writeFileSync(stampPath, stamp);
          manifest.sourceSha = process.env.P01_PACKAGE_SHA;
          manifest.files.push({path: staticPath + 'data/ecrl-reference-alignment.geojson'});
          manifest.files.sort((a,b)=>a.path.localeCompare(b.path));
          for (const row of manifest.files) {
            row.sha256 = hash(fs.readFileSync(path.join(root, row.path)));
          }
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
          console.log('P01_QA_FIXTURE_NO_BUILD', manifest.sourceSha, manifest.files.length);
          NODE
          node --test tests/p01-protected-preview-package.test.cjs
      - name: Verify and exercise the original R128 prebuilt without rebuilding
        if: github.ref_name == 'candidate/p01-ecrl-integration-recovery-20261128'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source='ed7077cec4b1a0e869e93299c0cdb125be362500'
          test "$(git rev-parse HEAD^)" = "$source"
          test "$(git diff --name-only "$source" HEAD)" = $'.github/workflows/p01-unified-map-composition-qa.yml\nvercel.json'
          git checkout --detach "$source"
          outer="$RUNNER_TEMP/p01-r118-outer.zip"
          curl --fail --silent --show-error --location --retry 2 \
            --header "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/15248000226/zip" --output "$outer"
          echo "13a47ba73a951c9f6e5da51229aebfb4bf253ddf3840e5c2e191267936e0a82b  $outer" | sha256sum --check
          export P01_PREVIEW_PACKAGE="$RUNNER_TEMP/p01-package"
          python3 - "$outer" "$source" <<'PY'
          import hashlib, io, json, os, pathlib, subprocess, sys, zipfile

          base = 'd28c309a76556387c794d52fd3254231ee515598'
          sha = sys.argv[2]
          root = pathlib.Path(os.environ['P01_PREVIEW_PACKAGE'])
          manifest_name = 'release-manifest.json'
          static = '.vercel/output/static/'
          stamp_name = static + 'assets/build-info.js'
          digest = lambda data: hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(sys.argv[1]) as outer:
              assert outer.testzip() is None
              baseline = outer.read('prebuilt-d28c309.zip')
          assert digest(baseline) == 'd781a29706062b453fb2353652648e17685a557db7e9f793e0d19420ae438f90'
          with zipfile.ZipFile(io.BytesIO(baseline)) as original:
              assert original.testzip() is None and len(original.namelist()) == 158
              files = {name: original.read(name) for name in original.namelist()}
          manifest = json.loads(files[manifest_name])
          assert manifest['sourceSha'] == base and manifest['target'] == 'preview'
          assert len(manifest['files']) == 157
          assert set(files) == {row['path'] for row in manifest['files']} | {manifest_name}
          for row in manifest['files']:
              assert digest(files[row['path']]) == row['sha256'], row['path']

          def apply_prebuilt_overlay(parent, revision, expected_files, expected_zip_hash):
              changed = subprocess.check_output(
                  ['git', 'diff', '--name-only', parent, revision, '--', 'assets/', 'unified-map-v8.html'],
                  text=True
              ).splitlines()
              assert len(changed) == expected_files
              for name in changed:
                  assert static + name in files
                  files[static + name] = subprocess.check_output(['git', 'show', revision + ':' + name])
              assert files[stamp_name].count(parent.encode()) == 1
              files[stamp_name] = files[stamp_name].replace(parent.encode(), revision.encode())
              manifest['sourceSha'] = revision
              for row in manifest['files']:
                  row['sha256'] = digest(files[row['path']])
              files[manifest_name] = (json.dumps(manifest, indent=2) + '\n').encode()

              archive = io.BytesIO()
              with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as candidate:
                  for name in sorted(files):
                      entry = zipfile.ZipInfo(name)
                      entry.compress_type = zipfile.ZIP_DEFLATED
                      entry.external_attr = 0o100600 << 16
                      candidate.writestr(entry, files[name])
              checksum = digest(archive.getvalue())
              assert checksum == expected_zip_hash, checksum
              return archive

          icon = '719f458c86ab2297bd4e259df560dd5a54502b8f'
          apply_prebuilt_overlay(base, icon, 7, '9a7bb4e372237f9fc2980498d6d2e93a821250a01c1f4614f2cfe0442514f5f1')
          assert subprocess.check_output(['git','rev-parse',sha+'^'],text=True).strip() == icon
          archive = apply_prebuilt_overlay(icon, sha, 4, '7fc3ac2101713ad2c7a1a5547f139d0bc0d703ecc20ccd90abe9e4cc65f547f1')
          with zipfile.ZipFile(archive) as candidate:
              assert candidate.testzip() is None
              assert set(candidate.namelist()) == set(files)
              assert all(digest(candidate.read(r['path'])) == r['sha256'] for r in manifest['files'])
              candidate.extractall(root)
          print('P01_R128_PREBUILT_VERIFIED', sha, len(manifest['files']), len(files), digest(archive.getvalue()))
          PY
          node --test tests/p01-protected-preview-package.test.cjs
      - name: Run Public, Member, ECRL and R211 regression
        run: |
          npm ci --ignore-scripts
          node --test tests/p01-ecrl-data-contract.test.cjs tests/p01-member-public-map-contract.test.cjs tests/p01-role-map-runtime.test.cjs tests/p01-role-map-integration.test.cjs tests/r211-mobile-map-ux.test.cjs tests/unified-ecrl-chainage.test.cjs tests/unified-ecrl-foundation.test.cjs tests/unified-ecrl-alignment-r2.test.cjs tests/unified-ecrl-d102-preflight.test.cjs tests/unified-ecrl-route-lab-satellite-stations.test.cjs tests/unified-v7-regression.test.cjs
      - name: Run Member Auth regression
        if: github.ref_name == 'candidate/p01-member-auth-recovery-20261127'
        run: node --test tests/auth-wiring.test.cjs
      - name: Run Owner reference boundary, popup and access regression
        if: github.ref_name == 'candidate/p01-ecrl-integration-recovery-20261128'
        run: node --test tests/unified-ecrl-owner-calibration.test.cjs tests/unified-ecrl-consumer-popup.test.cjs tests/p01-maplibre-security.test.cjs tests/auth-wiring.test.cjs
      - name: Run composition QA in MapLibre, Chromium and WebKit
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          vendor="$RUNNER_TEMP/p01-maplibre"
          mkdir -p "$vendor"
          curl --fail --silent --show-error --location --retry 2 https://registry.npmjs.org/maplibre-gl/-/maplibre-gl-6.13.0.tgz --output "$vendor/maplibre-gl.tgz"
          echo "10b5e4e21fb197451115012755b00de8c1a7eb53fa8eae1a9945878ac90b56cbc709a29d7f566ae86f1434e0f4010dd4697a0be4409cf28bf3f32a9810118f2b  $vendor/maplibre-gl.tgz" | sha512sum --check
          checksums="$GITHUB_WORKSPACE/tests/fixtures/p01-maplibre-6.13.0.sha256"
          while read -r digest filename; do
            tar -xzOf "$vendor/maplibre-gl.tgz" "package/dist/$filename" > "$vendor/$filename"
          done < "$checksums"
          (cd "$vendor" && sha256sum --check "$checksums")
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/p01-package/.vercel/output/static" > "$RUNNER_TEMP/p01-visual-http.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          curl --fail --silent --retry 4 --retry-connrefused --output /dev/null http://127.0.0.1:8765/unified-map-v7.html
          if [[ "$GITHUB_REF_NAME" == candidate/p01-member-auth-recovery-20261127 ]]; then
            sdk="$RUNNER_TEMP/supabase-2.117.2.js"
            curl --fail --silent --show-error --location --retry 2 https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2 --output "$sdk"
            echo "2eebfe06b1b5309985dc1526e8981ea3a18b71beeef83e7f38e04c303e142d6d  $sdk" | sha256sum --check
            mkdir -p artifacts/p01-technology-integration
            P01_AUTH_SDK="$sdk" node tests/p01-member-auth-browser.test.cjs | tee artifacts/p01-technology-integration/member-auth-qa.jsonl
          fi
          unset P01_QA_PRIVATE_R57_FILE
          P01_QA_MAP_COMPOSITION_ONLY=1 P01_MAPLIBRE_DIST="$vendor" node tests/p01-technology-integration-browser.test.mjs
          if [[ "$GITHUB_REF_NAME" != 'candidate/p01-ecrl-integration-recovery-20261128' ]]; then
            P01_QA_RAILWAY_HIERARCHY_ONLY=1 P01_MAPLIBRE_DIST="$vendor" P01_QA_OUTPUT=artifacts/p01-technology-integration/hierarchy node tests/p01-technology-integration-browser.test.mjs
          fi
      - name: Archive browser evidence
        if: always() && github.ref_name != 'candidate/p01-ecrl-integration-recovery-20261128'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-unified-map-composition-browser-qa
          path: artifacts/p01-technology-integration/
          retention-days: 14
      - name: Archive ECRL recovery test receipts
        if: always() && github.ref_name == 'candidate/p01-ecrl-integration-recovery-20261128'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-ecrl-integration-recovery-qa-receipts
          path: artifacts/p01-technology-integration/visual-qa.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve exact tested prebuilt package without rebuilding
        if: success() && github.ref_name == 'candidate/p01-ecrl-segment-evidence-20261127'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'p01-package'
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'p01-release-artifact'
          out.mkdir()
          manifest = json.loads((root / 'release-manifest.json').read_text())
          assert manifest['sourceSha'] == os.environ['P01_PACKAGE_SHA']
          assert manifest['target'] == 'preview'
          expected = {row['path']: row['sha256'] for row in manifest['files']}
          assert len(expected) == 157
          files = sorted(p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file())
          assert set(files) == set(expected) | {'release-manifest.json'}
          assert not any(p.is_symlink() for p in root.rglob('*'))
          assert all(p.startswith('.vercel/output/static/') or p in ('.vercel/output/config.json', 'vercel.json') for p in expected)
          for p, digest in expected.items():
              assert hashlib.sha256((root / p).read_bytes()).hexdigest() == digest, p
          name = 'prebuilt-' + manifest['sourceSha'][:7] + '.zip'
          archive = out / name
          with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for p in files:
                  z.write(root / p, p)
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              assert set(z.namelist()) == set(files)
              for p, digest in expected.items():
                  assert hashlib.sha256(z.read(p)).hexdigest() == digest, p
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          (out / (name + '.sha256')).write_text(digest + '  ' + name + '\n')
          print('P01_PREBUILT_ARCHIVE_VERIFIED', manifest['sourceSha'], len(expected), archive.stat().st_size, digest)
          PY
      - name: Archive exact tested prebuilt output
        if: success() && github.ref_name == 'candidate/p01-ecrl-segment-evidence-20261127'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-prebuilt-tested
          path: ${{ runner.temp }}/p01-release-artifact/
          if-no-files-found: error
          retention-days: 14
