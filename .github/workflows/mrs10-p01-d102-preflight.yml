name: P01 D102 pre-run Owner confirmation & data QA
on:
  push:
    branches:
      - feature/mrs10-p01-satellite-stn01-ch-trail-r14-20261029
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit
      - run: |
          node --check assets/unified-ecrl/route-lab-d102-preflight.js
          node --check assets/unified-ecrl/route-lab-d102-preflight-ui.js
          node --check assets/unified-ecrl/route-lab-d102-observations.js
          node --test tests/unified-ecrl-d102-preflight.test.cjs tests/unified-ecrl-route-lab-satellite-stations.test.cjs tests/unified-ecrl-manual-route-lab.test.cjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit
      - run: node scripts/build-unified-v8.cjs
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps webkit
      - run: |
          python3 -m http.server 8765 --directory dist-unified-v8 >/tmp/d102-preflight.log 2>&1 &
          node tests/unified-ecrl-d102-preflight-browser.test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: d102-preflight-owner-coordinate-browser-qa
          path: artifacts/ecrl-d102-gate/
          retention-days: 14
