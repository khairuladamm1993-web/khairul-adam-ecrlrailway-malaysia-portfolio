name: P01 ECRL public geospatial source discovery R3
on:
  push:
    branches:
      - feature/mrs10-p01-authoritative-gis-discovery-r3-20261029
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit
      - name: R3 GIS identity and non-publish regression
        run: node --test tests/unified-ecrl-alignment-r2.test.cjs tests/unified-ecrl-chainage.test.cjs tests/ecrl-public-geoservice-source.test.mjs
      - run: node scripts/build-unified-v8.cjs
  live-public-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Read public ArcGIS metadata only (no coordinates or features)
        run: node scripts/audit-ecrl-public-geoservices.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-ecrl-arcgis-metadata-readonly
          path: artifacts/ecrl-gis-source-audit/
          retention-days: 14
