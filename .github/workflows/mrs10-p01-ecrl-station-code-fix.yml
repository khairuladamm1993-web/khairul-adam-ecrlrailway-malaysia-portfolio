name: MR-S10 P01 ECRL station code regression (isolated)
on:
  push:
    branches:
      - fix/mrs10-p01-ecrl-station-code-display-20261029
  workflow_dispatch:
permissions:
  contents: read
jobs:
  station-codes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run ECRL code and source integrity regression
        run: node --test tests/unified-ecrl-foundation.test.cjs
