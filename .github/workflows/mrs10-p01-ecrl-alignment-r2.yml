name: MR-S10 P01 ECRL Alignment Evidence R2 isolated QA
on:
  push:
    branches:
      - feature/mrs10-p01-ecrl-alignment-evidence-r2-20261029
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit
      - name: Baseline + R2 source integrity and survey gating
        run: node --test tests/unified-ecrl-foundation.test.cjs tests/unified-ecrl-consumer-popup.test.cjs tests/unified-ecrl-chainage.test.cjs tests/unified-ecrl-owner-calibration.test.cjs tests/unified-ecrl-port-references.test.cjs tests/unified-ecrl-kerteh-freight.test.cjs tests/unified-ecrl-alignment-r2.test.cjs tests/unified-v81-focus.test.cjs
      - run: node scripts/build-unified-v8.cjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit
      - run: node scripts/build-unified-v8.cjs
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps webkit
      - name: Alignment evidence and popup tapability six viewports
        run: |
          python3 -m http.server 8765 --directory dist-unified-v8 >/tmp/mrs10-alignment-r2.log 2>&1 &
          node tests/unified-ecrl-alignment-r2-browser.test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ecrl-alignment-evidence-r2-uat-evidence
          path: artifacts/ecrl-alignment-r2/
          retention-days: 14
