name: P01 UAT17 Candidate QA
on:
  push:
    branches:
      - candidate/p01-uat17-maintenance-preview-20261122
      - candidate/p01-orchestrator-v1-20261123
      - candidate/p01-auth-client-readiness-20261123
      - candidate/p01-ecrl-unified-design-v1-20261123
      - candidate/p01-technology-integration-v1-20261123
      - candidate/p01-maplibre-security-v1-20261123
      - candidate/p01-visual-refinement-mrnext-20261124
  pull_request:
    paths:
      - 'assets/map-gateway.js'
      - 'assets/gateway.css'
      - 'tests/p01-*.test.cjs'
      - 'scripts/p01-ecrl-alignment-evidence-gate.cjs'
      - 'supabase/functions/mrs10-maintenance-control/**'
      - 'supabase/staging/maintenance-control-review-only.sql'
      - '.github/workflows/p01-uat17-contract.yml'
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ${{ (github.ref_name == 'candidate/p01-technology-integration-v1-20261123' || (github.ref_name == 'candidate/p01-maplibre-security-v1-20261123' || github.ref_name == 'candidate/p01-visual-refinement-mrnext-20261124')) && 'ubuntu-24.04' || 'ubuntu-latest' }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: ${{ github.ref_name == 'candidate/p01-orchestrator-v1-20261123' && '0' || '1' }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check assets/map-gateway.js
          node --check assets/public-gateway.js
          node --check scripts/build-p01-map-candidate.cjs
          node --check scripts/p01-ecrl-alignment-evidence-gate.cjs
          node --check scripts/p01-ecrl-gap-coverage-audit.cjs
      - name: P01 UAT17 focused regression tests
        run: node --test tests/p01-ecrl-gap-coverage-audit.test.cjs tests/p01-ecrl-alignment-evidence-gate.test.cjs tests/p01-uat17-ecrl-inventory.test.cjs tests/p01-uat17-map-fullscreen.test.cjs tests/p01-member-public-map-contract.test.cjs tests/p01-role-map-integration.test.cjs tests/p01-role-map-runtime.test.cjs tests/p01-uat17-refresh.test.cjs tests/p01-uat17-maintenance-source.test.cjs tests/p01-maintenance-server-contract.test.cjs
      - name: P01 authentication client regression tests
        if: github.event_name == 'push' && (github.ref_name == 'candidate/p01-auth-client-readiness-20261123' || github.ref_name == 'candidate/p01-ecrl-unified-design-v1-20261123' || (github.ref_name == 'candidate/p01-technology-integration-v1-20261123' || (github.ref_name == 'candidate/p01-maplibre-security-v1-20261123' || github.ref_name == 'candidate/p01-visual-refinement-mrnext-20261124')))
        run: |
          node -e 'require("node:assert/strict").equal(require("./vercel.json").git.deploymentEnabled[process.env.GITHUB_REF_NAME], false)'
          npm ci
          node --check assets/access.js
          node --check assets/member-gateway.js
          node --test tests/auth-wiring.test.cjs
      - name: P01 ECRL design and preservation tests
        if: github.event_name == 'push' && (github.ref_name == 'candidate/p01-ecrl-unified-design-v1-20261123' || (github.ref_name == 'candidate/p01-technology-integration-v1-20261123' || (github.ref_name == 'candidate/p01-maplibre-security-v1-20261123' || github.ref_name == 'candidate/p01-visual-refinement-mrnext-20261124')))
        run: |
          node --check assets/unified-ecrl/adapter.js
          node --check assets/unified-ecrl/integration-ui.js
          node --check assets/unified-v8-map.js
          node --test tests/unified-ecrl-foundation.test.cjs tests/unified-ecrl-alignment-r2.test.cjs tests/unified-ecrl-consumer-popup.test.cjs tests/unified-ecrl-chainage.test.cjs tests/unified-v8-regression.test.cjs tests/unified-v81-focus.test.cjs
      - name: P01 Railway Data Contract V1
        if: github.event_name == 'push' && (github.ref_name == 'candidate/p01-technology-integration-v1-20261123' || (github.ref_name == 'candidate/p01-maplibre-security-v1-20261123' || github.ref_name == 'candidate/p01-visual-refinement-mrnext-20261124'))
        run: node --test tests/p01-ecrl-data-contract.test.cjs
      - name: Verify and run the P01 orchestrator pilot
        if: github.event_name == 'push' && github.ref_name == 'candidate/p01-orchestrator-v1-20261123'
        run: |
          node --test tests/p01-orchestrator.test.cjs
          node scripts/p01-orchestrator.cjs
      - name: Safe static artifact build
        run: python3 scripts/build-production.py dist-production

      - name: Build isolated P01 Public and Member map candidate artifact
        run: node scripts/build-p01-map-candidate.cjs dist-p01-map-candidate
      - name: P01 MapLibre dependency audit and pins
        if: github.event_name == 'push' && (github.ref_name == 'candidate/p01-maplibre-security-v1-20261123' || github.ref_name == 'candidate/p01-visual-refinement-mrnext-20261124')
        run: |
          node --test tests/p01-maplibre-security.test.cjs tests/unified-v5-regression.test.cjs tests/unified-v6-regression.test.cjs
          audit="$RUNNER_TEMP/p01-maplibre-audit"
          mkdir -p "$audit"
          printf '%s\n' '{"name":"p01-maplibre-audit","version":"1.0.0","private":true,"dependencies":{"maplibre-gl":"6.13.0"}}' > "$audit/package.json"
          npm --prefix "$audit" install --package-lock-only --ignore-scripts --no-audit
          npm --prefix "$audit" audit --audit-level=moderate

  browser-qa:
    if: github.event_name == 'push' && (github.ref_name == 'candidate/p01-technology-integration-v1-20261123' || (github.ref_name == 'candidate/p01-maplibre-security-v1-20261123' || github.ref_name == 'candidate/p01-visual-refinement-mrnext-20261124'))
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install P01 visual QA dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - name: Verify P01 MapLibre browser assets
        run: |
          vendor="$RUNNER_TEMP/p01-maplibre"
          checksums="$GITHUB_WORKSPACE/tests/fixtures/p01-maplibre-6.13.0.sha256"
          mkdir -p "$vendor"
          package="$vendor/maplibre-gl.tgz"
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 45 --retry 2 https://registry.npmjs.org/maplibre-gl/-/maplibre-gl-6.13.0.tgz --output "$package"
          echo "10b5e4e21fb197451115012755b00de8c1a7eb53fa8eae1a9945878ac90b56cbc709a29d7f566ae86f1434e0f4010dd4697a0be4409cf28bf3f32a9810118f2b  $package" | sha512sum --check
          while read -r digest filename; do
            tar -xzOf "$package" "package/dist/$filename" > "$vendor/$filename"
          done < "$checksums"
          (cd "$vendor" && sha256sum --check "$checksums")
          echo "P01_MAPLIBRE_DIST=$vendor" >> "$GITHUB_ENV"
      - name: P01 integrated visual QA
        run: |
          if [ "$GITHUB_REF_NAME" = 'candidate/p01-visual-refinement-mrnext-20261124' ]; then
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            P01_EXPECTED_SHA="$GITHUB_SHA" node scripts/build-p01-protected-preview.cjs "$RUNNER_TEMP/p01-visual-package"
            static="$RUNNER_TEMP/p01-visual-package/.vercel/output/static"
          else
            node scripts/build-p01-map-candidate.cjs dist-p01-map-candidate
            static=dist-p01-map-candidate
          fi
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$static" > "$RUNNER_TEMP/p01-visual-http.log" 2>&1 &
          trap 'kill "$!" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 4 --retry-connrefused --output /dev/null http://127.0.0.1:8765/unified-map-v8.html
          node tests/p01-technology-integration-browser.test.mjs
      - name: Archive visual QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-technology-integration-visual-qa
          path: artifacts/p01-technology-integration/
          retention-days: 14
