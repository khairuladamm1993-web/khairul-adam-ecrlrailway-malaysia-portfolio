name: ECRL GIS V1 isolated data and language QA
on:
  push:
    branches:
      - feature/mrs10-p01-ecrl-gis-c2-infrastructure-isolated
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: ECRL provenance + 4-language + data safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run isolated ECRL dataset QA
        run: node --test tests/ecrl-gis-v1.test.cjs
      - name: Parse browser modules
        run: |
          node --check assets/ecrl-gis-v1/data.js
          node --check assets/ecrl-gis-v1/i18n.js
          node --check assets/ecrl-gis-v1/app.js
