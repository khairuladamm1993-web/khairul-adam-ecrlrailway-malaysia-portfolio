<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>MR-S10 | KTM Komuter V2 · Isolated Preview</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.13.0/dist/maplibre-gl.css">
<style>
:root{color-scheme:light;--bg:#f4f8fa;--card:#fff;--fg:#19323f;--muted:#475d68;--border:#9caeb8;--focus:#096c91}
:root[data-theme="dark"]{color-scheme:dark;--bg:#091923;--card:#16303d;--fg:#f0fbff;--muted:#d5e7ef;--border:#839da9;--focus:#7ac8f3}
*{box-sizing:border-box}body{font:15px/1.45 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg);margin:0}main{max-width:1160px;margin:auto;padding:13px}header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}h1{font-size:clamp(1.15rem,3vw,1.55rem);margin:4px 0}small,.muted{color:var(--muted)}p{margin:6px 0 11px}
button,select{font:inherit;min-height:44px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--fg);padding:8px 11px;touch-action:manipulation}button[aria-pressed="true"]{outline:2px solid var(--focus);outline-offset:-2px;font-weight:800}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.toolbar,.filters{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:9px 0}.filters button{display:inline-flex;gap:7px;align-items:center;max-width:100%;text-align:left}.swatch{display:block;width:15px;height:15px;min-width:15px;border-radius:50%;background:var(--swatch);border:2px solid var(--card);box-shadow:0 0 0 1px var(--border)}
#map-shell{position:relative}#map{height:clamp(380px,62dvh,750px);background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}.panel{border:1px solid var(--border);border-radius:12px;background:var(--card);padding:11px;margin:12px 0}#map-status{font-size:.91rem;font-weight:680}#expand{position:absolute;top:10px;right:10px;z-index:9;padding:7px 10px}
#map-shell.expanded{position:fixed;inset:0;z-index:1000;background:var(--bg);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}#map-shell.expanded #map{height:100%}
#map .maplibregl-popup-content{background:var(--card);color:var(--fg);border-radius:10px;padding:18px 13px 12px;max-width:min(295px,83vw)}#map .maplibregl-popup-close-button{width:44px;height:44px;font-size:24px;color:var(--fg)}#map .maplibregl-popup-content p{font-size:.85rem;color:var(--fg)}#map .maplibregl-popup-content a{color:var(--fg)}
#services{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,295px),1fr));gap:12px}.service{min-width:0;border:1px solid var(--border);background:var(--card);padding:11px;border-radius:11px}.service h2{font-size:1rem;margin:0;padding:4px 0 4px 10px;border-left:5px solid var(--route)}.service p{font-size:.81rem;color:var(--muted)}.service ol{margin:8px 0 0;padding:0 0 0 7px;max-height:min(48dvh,445px);overflow:auto;overscroll-behavior:contain;list-style:none;background:linear-gradient(var(--route),var(--route)) 19px 0/3px 100% no-repeat}.service li{margin:0;min-height:46px}.service li button{border:0;background:transparent;width:100%;display:flex;align-items:center;gap:10px;min-height:44px;text-align:left;padding:4px 0}.service li button:hover{background:var(--bg)}.index{border-radius:50%;flex:0 0 32px;width:32px;height:32px;background:var(--route);color:#fff;display:grid;place-items:center;font-size:.8rem;font-weight:800;box-shadow:0 0 0 2px var(--card)}.station-name{overflow-wrap:anywhere}.interchange{font-size:.75rem;color:var(--muted)}a{overflow-wrap:anywhere;color:var(--fg)}.security-note{font-size:.83rem}
@media(max-width:520px){#services{grid-template-columns:1fr}main{padding:9px}.filters button{font-size:.83rem;padding:6px 8px}.toolbar select{max-width:120px}}
</style></head>
<body><main><header><div><small>MR-S10 · P01 · KTM V2 · ISOLATED · NO PRODUCTION</small><h1 id="heading">KTM Komuter — 6 service identities</h1></div><div class="toolbar"><label for="lang">Language</label><select id="lang"><option value="ms">BM</option><option value="en">EN</option><option value="zh">中文</option><option value="th">ไทย</option></select><button id="theme" type="button" aria-label="Toggle light and dark map">◐ Light / Dark</button></div></header>
<p id="intro"></p><div id="filters" class="filters" role="group" aria-label="Focus on KTM services"></div>
<div id="map-shell"><div id="map" role="region" aria-label="KTM station source-backed MapLibre map"></div><button id="expand" aria-expanded="false" type="button" aria-label="Expand map">⛶</button></div>
<div class="panel"><p id="map-status" role="status" aria-live="polite"></p><p class="security-note" id="evidence"></p><p><a href="https://www.ktmb.com.my/TrainTime.html" rel="noopener noreferrer" target="_blank">KTMB timetable</a> · <a href="https://developer.data.gov.my/realtime-api/gtfs-static.en" rel="noopener noreferrer" target="_blank">KTMB GTFS (CC BY 4.0)</a> · <a href="https://services5.arcgis.com/2ZRAaoTSJbQ20ceg/arcgis/rest/services/SELANGOR_RAILWAY_MAP/FeatureServer/0" rel="noopener noreferrer" target="_blank">Klang Valley GIS</a> · <a href="https://service.mygeomap.gov.my/arcgis/rest/services/Transportation_services/1MM_Template_Servis_Pengangkutan/MapServer/2" rel="noopener noreferrer" target="_blank">MyGeoMap KTM candidate GIS</a></p></div>
<section id="services" aria-label="KTM ordered stations"></section><div class="panel security-note"><p id="notice"></p></div>
</main>
<script src="./assets/mrs10-r223-ktm-service.js"></script><script>
(async function(){'use strict';
const $=id=>document.getElementById(id),api=window.MRS10KTMV2;
const t={
ms:{heading:'KTM Komuter — enam identiti perkhidmatan',intro:'Line pada lineup, marker dan legend menggunakan warna perkhidmatan yang sama. Lineup hanya skematik.',all:'Semua / Reset',count:'stesen',shared:'Kongsi stesen',pending:'Menyemak GIS awam. Lokasi tidak direka.',matched:n=>'GIS sekunder: '+n+' lokasi stesen dipadankan (bukan koordinat operasi).',noMapped:'Tiada lokasi GIS dipadankan untuk laluan ini. Lineup skematik masih tersedia.',mapped:'titik GIS dipadankan',unavailable:'GIS tidak tersedia; lineup stesen masih boleh digunakan.',noPoint:'Lokasi stesen ini belum dapat dipadankan dengan GIS; jangan anggap titik atau jajaran rekaan.',point:'Lokasi daripada GIS sekunder, bukan ukuran operasi KTMB.',code:'Kod KTMB: belum disahkan',source:'Sumber geografi: GIS sekunder',sourceOfficial:'Sumber: data.gov.my · KTMB GTFS rasmi',officialPoint:'Titik hentian GTFS rasmi KTMB (bukan ukuran operasi trek).',note:'Paparan ini tidak mencipta garisan fizikal. Warna HEX anggaran UI; warna Selatan sementara. Data stesen KTMB/GTFS perlu diaudit semula sebelum integrasi.'},
en:{heading:'KTM Komuter — six service identities',intro:'Lineup, legend and station pins share their service color. The station sequence is schematic.',all:'All / Reset',count:'stations',shared:'Shared station',pending:'Checking public GIS; no invented positions.',matched:n=>'Secondary GIS: '+n+' matched station locations (not operational coordinates).',noMapped:'No matched GIS station positions for this service. The schematic lineup remains available.',mapped:'matched GIS points',unavailable:'GIS is unavailable; ordered station lists remain usable.',noPoint:'No verified GIS match for this station; no invented points or rail lines.',point:'Secondary GIS reference, not KTMB operational survey.',code:'KTMB code: unverified',source:'Geospatial source: secondary GIS',sourceOfficial:'Source: data.gov.my · official KTMB GTFS',officialPoint:'Official KTMB GTFS stop location (not surveyed track).',note:'No physical railway polyline is invented. HEX are UI approximations; Southern colors provisional. Recheck KTMB/GTFS prior to integration.'},
zh:{heading:'KTM Komuter — 六条服务线路',intro:'列表线、图例和车站标记使用相同线路颜色。站序为示意图。',all:'全部 / 重置',count:'站',shared:'共用车站',pending:'正在检查公开 GIS；不会捏造位置。',matched:n=>'辅助 GIS：'+n+' 个已匹配站点（非运营测量坐标）。',noMapped:'该线路暂无匹配的 GIS 站点，仍可查看示意站序。',mapped:'个 GIS 匹配点',unavailable:'无法读取 GIS，车站列表仍可查看。',noPoint:'车站暂无可验证 GIS 位置，不生成虚假点位。',point:'二级 GIS 参考位置，非 KTMB 运营测量',code:'KTMB 车站代码：尚未核实',source:'地理来源：二级 GIS',sourceOfficial:'来源：data.gov.my · KTMB 官方 GTFS',officialPoint:'KTMB 官方 GTFS 站点坐标（非轨道测量数据）',note:'不绘制未经验证的真实铁路轨道。颜色为近似 UI 色，南部颜色为临时方案。'},
th:{heading:'KTM Komuter — 6 บริการ',intro:'สีหมุด สัญลักษณ์ และลำดับสถานีตรงกับสีบริการ แผนผังเป็นเพียงลำดับ',all:'ทั้งหมด / รีเซ็ต',count:'สถานี',shared:'สถานีร่วม',pending:'กำลังตรวจสอบ GIS ไม่มีการสร้างพิกัดเอง',matched:n=>'GIS แหล่งข้อมูลรอง: จับคู่ได้ '+n+' สถานี (ไม่ใช่พิกัดสำรวจเดินรถ)',noMapped:'ยังไม่มีจุดสถานี GIS ที่จับคู่ได้สำหรับบริการนี้ สามารถดูแผนผังลำดับสถานี',mapped:'จุดสถานี GIS ที่จับคู่ได้',unavailable:'ไม่สามารถโหลด GIS ได้ แต่รายการสถานียังแสดง',noPoint:'ไม่มีตำแหน่ง GIS ที่ตรวจสอบได้ ไม่สร้างตำแหน่งหรือเส้นรางเอง',point:'พิกัด GIS รอง ไม่ใช่การสำรวจปฏิบัติการ',code:'รหัส KTMB: ยังไม่ยืนยัน',source:'แหล่ง GIS รอง',sourceOfficial:'แหล่งข้อมูล: data.gov.my · KTMB GTFS ทางการ',officialPoint:'ตำแหน่งสถานี GTFS ทางการ KTMB (ไม่ใช่แนวรางที่สำรวจ)',note:'ไม่มีการสร้างแนวรางจริง สีเป็นค่าประมาณของ UI และสีบริการใต้ยังไม่ใช่สีทางการ'}
};
let catalogue,focus='all',theme='light',map=null,lib=null,decoded=null,activePopup=null,styleReady=false,officialError='';
const word=()=>t[$('lang').value]||t.en,txt=(id,s)=>{$(id).textContent=s;},routes=()=>catalogue.services;
const regionLabel=sector=>({central:'Lembah Klang / Klang Valley',north:'Utara / North',south:'Selatan / South'})[sector];
function updateEvidence(){
 const points=chooseFeatures().features;
 const official=points.filter(f=>f.properties.status==='OFFICIAL_KTMB_GTFS_STOP_COORDINATE').length;
 const label=!points.length?word().pending:official===points.length?word().officialPoint:official?word().officialPoint+' / '+word().point:word().point;
 txt('evidence',label+' · '+word().code);
}
function statusMessage(){updateEvidence();
 if(!decoded?.ok){txt('map-status',officialError?'GTFS rasmi gagal dimuatkan ('+officialError+'). Sila log masuk ke Preview dan refresh.':word().unavailable);return;}
 if(focus==='all'){txt('map-status',word().matched(decoded.matched));return;}
 const route=routes().find(r=>r.id===focus);
 const count=chooseFeatures().features.length;
 txt('map-status',route.displayName+': '+(count?count+' '+word().mapped:officialError?'GTFS rasmi tidak dapat diakses ('+officialError+'). Sila refresh selepas log masuk.':word().noMapped));
}
function render(){if(!catalogue)return;const w=word();txt('heading',w.heading);txt('intro',w.intro);txt('notice',w.note);updateEvidence();const controls=$('filters');controls.replaceChildren();for(const r of [{id:'all',displayName:w.all},...routes()]){const b=document.createElement('button');b.type='button';b.dataset.route=r.id;b.setAttribute('aria-pressed',String(focus===r.id));if(r.displayColor){const s=document.createElement('span');s.className='swatch';s.style.setProperty('--swatch',r.displayColor);b.append(s);}b.append(document.createTextNode(r.displayName));b.addEventListener('click',()=>selectRoute(r.id));controls.append(b);}
const list=$('services');list.replaceChildren();for(const r of routes().filter(x=>focus==='all'||focus===x.id)){const section=document.createElement('section');section.className='service';section.dataset.service=r.id;section.style.setProperty('--route',r.displayColor);const header=document.createElement('h2');header.textContent=r.displayName;section.append(header);const sub=document.createElement('p');sub.textContent=regionLabel(r.sector)+' · '+r.stationSequence.length+' '+w.count+' · '+(r.displayColorStatus.startsWith('PROVISIONAL')?'UI color provisional':'Evidence-based color approximation');section.append(sub);const ol=document.createElement('ol');ol.setAttribute('aria-label',r.displayName);for(const s of r.stationSequence){const li=document.createElement('li'),btn=document.createElement('button');btn.type='button';const number=document.createElement('span');number.className='index';number.textContent=s.order;const name=document.createElement('span');name.className='station-name';name.textContent=s.name;btn.append(number,name);if(api.stationServices(catalogue,s.name).length>1){const info=document.createElement('span');info.className='interchange';info.title=w.shared;info.textContent='⇄';btn.append(info);}btn.addEventListener('click',()=>openStation(s,r));li.append(btn);ol.append(li);}section.append(ol);list.append(section);}}
function chooseFeatures(){return api.visibleStations(decoded,focus);}
function focusSelectedRoute(){
 // Focus is derived only from source-backed points; never approximate station coordinates.
 if(!map||!decoded?.ok||!styleReady)return false;
 const f=chooseFeatures().features;
 if(!f.length)return false;
 const lon=f.map(s=>s.geometry.coordinates[0]),lat=f.map(s=>s.geometry.coordinates[1]);
 if(f.length===1){
  map.flyTo({center:f[0].geometry.coordinates,zoom:10.5,duration:250});
 }else{
  map.fitBounds([[Math.min(...lon),Math.min(...lat)],[Math.max(...lon),Math.max(...lat)]],
   {padding:Math.min(60,Math.floor(Math.min(map.getContainer().clientWidth||360,map.getContainer().clientHeight||420)/6)),maxZoom:focus==='all'?9:10.5,duration:250});
 }
 return true;
}
function selectRoute(id){
 focus=id;
 activePopup?.remove();activePopup=null;
 render();
 updateLayers();
 statusMessage();
 // If the visitor selects a service during GIS loading, initGIS must refocus again after load.
 focusSelectedRoute();
}
function pointFeature(name){return(decoded?.features||[]).find(f=>api.normal(f.properties.name)===api.normal(name));}
function openStation(s,r){const f=pointFeature(s.name);if(f&&map){statusMessage();map.flyTo({center:f.geometry.coordinates,zoom:12.2,duration:300});popup(f);}else txt('map-status',s.name+': '+word().noPoint);}
function popup(feature){if(!map||!lib)return;activePopup?.remove();const panel=document.createElement('div'),h=document.createElement('strong'),station=feature.properties;h.textContent=station.name;panel.append(h);const code=document.createElement('p');code.textContent=word().code;panel.append(code);const names=document.createElement('p');names.textContent=station.serviceIds.split('|').map(id=>routes().find(r=>r.id===id)?.displayName||id).join(' / ');panel.append(names);const source=document.createElement('p');source.textContent=station.status==='OFFICIAL_KTMB_GTFS_STOP_COORDINATE'?word().officialPoint:word().point;panel.append(source);const link=document.createElement('a');link.textContent=station.status==='OFFICIAL_KTMB_GTFS_STOP_COORDINATE'?word().sourceOfficial:word().source;link.href=station.sourceUrl||api.GIS_BASE;link.rel='noopener noreferrer';link.target='_blank';panel.append(link);activePopup=new lib.Popup({offset:16,maxWidth:'300px'}).setLngLat(feature.geometry.coordinates).setDOMContent(panel).addTo(map);}
function updateLayers(){if(!styleReady||!map?.getStyle?.()?.sources||!catalogue)return;for(const [index,r] of routes().entries()){const src='ktmv2-'+r.id,layer=src+'-points',geo=api.featuresForRoute(decoded,r.id);if(!map.getSource(src))map.addSource(src,{type:'geojson',data:geo});else map.getSource(src).setData(geo);if(!map.getLayer(layer))map.addLayer({id:layer,type:'circle',source:src,paint:{'circle-radius':['interpolate',['linear'],['zoom'],7,6,12,9],'circle-color':r.displayColor,'circle-opacity':.98,'circle-stroke-color':theme==='dark'?'#fff':'#102734','circle-stroke-width':2.7,'circle-translate':[index%2===0?-5:5,0]}});map.setLayoutProperty(layer,'visibility',focus==='all'||focus===r.id?'visible':'none');}
const pointSrc='ktmv2-unique-source',pointLayer='ktmv2-unique-label';if(!map.getSource(pointSrc))map.addSource(pointSrc,{type:'geojson',data:chooseFeatures()});else map.getSource(pointSrc).setData(chooseFeatures());if(!map.getLayer(pointLayer))map.addLayer({id:pointLayer,type:'symbol',source:pointSrc,minzoom:8.5,layout:{'text-field':['get','name'],'text-size':['interpolate',['linear'],['zoom'],8.5,11,12,13],'text-anchor':'top','text-offset':[0,1.25],'text-allow-overlap':false},paint:{'text-color':theme==='dark'?'#ffffff':'#17313f','text-halo-color':theme==='dark'?'#0b1922':'#ffffff','text-halo-width':2.8}});
}
async function initMap(){try{lib=await import('https://unpkg.com/maplibre-gl@6.13.0/dist/maplibre-gl.mjs');map=new lib.Map({container:'map',style:'https://tiles.openfreemap.org/styles/positron',center:[101.65,3.15],zoom:9,attributionControl:true});map.addControl(new lib.NavigationControl({showCompass:false}));map.on('style.load',()=>{styleReady=true;updateLayers();focusSelectedRoute();});map.on('click',e=>{for(const r of routes().filter(r=>focus==='all'||focus===r.id)){try{const hits=map.queryRenderedFeatures([[e.point.x-14,e.point.y-14],[e.point.x+14,e.point.y+14]],{layers:['ktmv2-'+r.id+'-points']});if(hits.length){const f=pointFeature(hits[0].properties.name);if(f){popup(f);return;}}}catch{}}});}catch{txt('map-status',word().unavailable);}}
async function fetchGis(url){
 const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12000);
 try{
  const response=await fetch(url,{credentials:'omit',cache:'no-store',mode:'cors',signal:controller.signal});
  if(!response.ok)throw Error('GIS HTTP '+response.status);
  const data=await response.json();
  if(data?.error)throw Error('GIS server error');
  return data;
 }finally{clearTimeout(timeout);}
}
async function initGIS(){
 txt('map-status',word().pending);
 // Start slower external GIS lookups independently, but never block official GTFS pins on CORS/timeouts.
 const secondaryPromise=Promise.allSettled([
  fetchGis(api.GIS_URL).then(d=>api.decodeGis(d,catalogue)),
  fetchGis(api.NATIONAL_GIS_URL).then(d=>api.decodeNationalGis(d,catalogue))
 ]);
 const official=await fetch('./assets/mrs10-r225-ktm-gtfs-stations.json',{cache:'no-store',credentials:'same-origin'})
   .then(async r=>{
    if(!r.ok)throw Error('HTTP '+r.status);
    if(!String(r.headers?.get('content-type')||'').toLowerCase().includes('application/json'))throw Error('INVALID_CONTENT_TYPE');
    const data=await r.json(),result=api.decodeOfficialGis(data,catalogue);
    if(!result?.ok||!result.matched)throw Error('INVALID_GTFS_DECODE');
    return result;
   })
   .catch(error=>{
    officialError=String(error?.message||'NETWORK_FAILURE').slice(0,80);
    console.warn('KTM official GTFS unavailable',officialError);
    return null;
   });
 // Show authoritative station markers immediately, even if secondary GIS hangs.
 if(official?.ok){
  decoded=api.mergeOfficialGis(null,official);
  updateLayers();
  statusMessage();
  focusSelectedRoute();
 }
 const [central,national]=await secondaryPromise;
 decoded=api.mergeOfficialGis(
   api.mergeGis(
     central.status==='fulfilled'?central.value:null,
     national.status==='fulfilled'?national.value:null
   ),
   official
 );
 updateLayers();
 statusMessage();
 focusSelectedRoute();
}
$('lang').addEventListener('change',()=>{render();statusMessage();});$('theme').addEventListener('click',()=>{theme=theme==='light'?'dark':'light';document.documentElement.dataset.theme=theme;styleReady=false;map?.setStyle('https://tiles.openfreemap.org/styles/'+(theme==='dark'?'dark':'positron'));});$('expand').addEventListener('click',()=>{const shell=$('map-shell'),isFull=!shell.classList.contains('expanded');shell.classList.toggle('expanded',isFull);$('expand').setAttribute('aria-expanded',String(isFull));setTimeout(()=>map?.resize(),100);});
try{const response=await fetch('./assets/mrs10-r223-ktm-catalogue.json',{cache:'no-store'});if(!response.ok)throw Error('Catalog HTTP');catalogue=await response.json();if(!api?.validateCatalogue(catalogue))throw Error('Catalog invalid');render();await initMap();await initGIS();}catch{txt('map-status','KTM catalogue invalid / Data katalog gagal dimuatkan.');}
})();
</script></body></html>
