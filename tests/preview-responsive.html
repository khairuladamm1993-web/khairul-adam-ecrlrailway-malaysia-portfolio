<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Migration responsive review</title><style>body{font:14px system-ui;margin:20px;background:#eef2f4;color:#14232d}button,select{min-height:44px;margin:4px}article{margin:24px 0}iframe{display:block;border:0;background:white}#controls{position:sticky;top:0;background:#eef2f4;padding:8px;z-index:1}</style><h1>Preview-only responsive review</h1><p>Viewport checks in the current browser engine, not physical-device tests.</p><div id="controls"><label for="page">Page</label><select id="page"><option value="index.html">Welcome</option><option value="gateway.html">Gateway</option><option value="portfolio.html">Portfolio</option><option value="references.html">References</option></select><label for="language">Language</label><select id="language"><option value="ms">BM</option><option value="en">EN</option><option value="zh">Chinese + Pinyin</option></select><label for="theme">Theme</label><select id="theme"><option>dark</option><option>light</option></select><button id="run">Load checkpoints</button></div><div id="frames"></div><script>
const sizes=[[320,568],[390,844],[430,932],[768,1024],[1024,768],[1024,1366],[1366,1024],[1366,768],[1440,900]];
document.querySelector('#run').onclick=()=>{localStorage.setItem('railway-language',document.querySelector('#language').value);localStorage.setItem('railway-pinyin',document.querySelector('#language').value==='zh'?'on':'off');localStorage.setItem('railway-theme',document.querySelector('#theme').value);document.querySelector('#frames').replaceChildren();for(const [w,h] of sizes){const article=document.createElement('article'),title=document.createElement('h2'),frame=document.createElement('iframe');title.textContent=w+' × '+h;frame.width=w;frame.height=h;frame.title=w+'x'+h;frame.src=document.querySelector('#page').value;article.append(title,frame);document.querySelector('#frames').append(article);}};
</script></html>
