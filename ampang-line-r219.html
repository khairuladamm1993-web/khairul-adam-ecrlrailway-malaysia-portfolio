<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.13.0/dist/maplibre-gl.css"><title>MR-S10 R2.19 · LRT Ampang Line | Isolated Registry</title>
<style>
:root{color-scheme:light;--bg:#f5f8fa;--card:#fff;--text:#162d3a;--muted:#415965;--line:#a9bac2;--orange:#A65100;--orange-bg:#fff1e2;--focus:#076a91;font-family:system-ui,-apple-system,Arial,sans-serif}
:root[data-theme=dark]{color-scheme:dark;--bg:#101f2b;--card:#142e3e;--text:#f3faff;--muted:#d0e1ee;--line:#667d8b;--orange:#FFBB7B;--orange-bg:#392917;--focus:#8edbff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-size:15px}
main{max-width:1040px;margin:auto;padding:12px max(12px,env(safe-area-inset-right)) 24px}
header,.toolbar{display:flex;align-items:center;gap:9px;justify-content:space-between;flex-wrap:wrap}
h1{font-size:1.15rem;line-height:1.3;margin:4px 0;color:var(--orange)}
p{line-height:1.48;margin:8px 0;color:var(--muted)}
button,select{font:inherit;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);padding:7px 10px}
button:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
fieldset{border:0;padding:0;margin:0;display:flex;gap:6px;align-items:center}
label{font-weight:650}.eyebrow{font-size:.8rem;color:var(--muted)}
.map{height:clamp(380px,65dvh,750px);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:12px;background:var(--card)}
iframe{width:100%;height:100%;border:0;display:block}
section{margin:12px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
summary{cursor:pointer;font-weight:750;min-height:44px;color:var(--orange);padding:8px 0}
.stats{font-size:.9rem;font-weight:700;color:var(--orange);border-left:4px solid var(--orange);padding-left:10px}
ol{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:7px;max-height:43dvh;overflow-y:auto;overscroll-behavior:contain}
li button{width:100%;display:flex;gap:10px;align-items:center;min-height:48px;text-align:left}
.num{display:grid;place-items:center;border-radius:50%;flex:0 0 31px;width:31px;height:31px;background:#A65100;color:#fff;font-size:.8rem;font-weight:800}
.name{flex:1;overflow-wrap:anywhere}.code{font-size:.77rem;color:var(--muted)}
li button:hover{background:var(--orange-bg)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);max-width:min(92vw,430px);width:100%;padding:16px}
dialog::backdrop{background:#091820b9}
dialog h2{font-size:1.1rem;color:var(--orange);margin:0 0 8px}
dialog p{margin:7px 0}.close-row{display:flex;justify-content:flex-end;margin-top:15px}
a{color:var(--orange);text-underline-offset:2px;overflow-wrap:anywhere}
.notice{font-size:.84rem}.map-reference{margin-top:12px}.map-reference summary{color:var(--text)}.map-reference .map{height:clamp(320px,53dvh,640px);margin-top:8px}.shared-tag{font-size:.72rem;border:1px solid var(--line);border-radius:5px;padding:2px 4px;color:var(--muted);white-space:nowrap}.legend-line{height:3px;width:40px;background:var(--orange);display:inline-block;vertical-align:middle;margin:0 8px}
@media(max-width:480px){main{padding:9px 10px 20px}.map{height:62dvh}ol{grid-template-columns:1fr}}
/* Unified MapLibre map + one timeline, like R2.18; source-independent AG station position remains UNVERIFIED. */
#r219-map-shell{position:relative;margin:10px 0}
#r219-map{height:clamp(430px,67dvh,780px);border:1px solid var(--line);border-radius:12px}
#r219-expand{position:absolute;top:12px;right:12px;z-index:2;min-width:44px;background:#eaf4f8;color:#183240;font-size:22px}
#r219-map-shell.expanded{position:fixed;inset:0;z-index:900;isolation:isolate;margin:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:var(--bg)}
#r219-map-shell.expanded #r219-map{height:100%;border:0;border-radius:0}
#r219-map-shell.expanded #r219-expand{top:calc(12px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right))}
#r219-map .maplibregl-popup-content{background:var(--card);color:var(--text);border-radius:9px;max-width:255px}
#r219-map .maplibregl-popup-close-button{color:var(--text);font-size:23px;min-width:44px;min-height:44px}
#r219-map .r219-popup{padding:23px 3px 5px;font-size:.86rem;overflow-wrap:anywhere;max-height:35dvh;overflow-y:auto}
#r219-map .r219-popup strong{font-size:.98rem;color:var(--orange)}#r219-map .r219-popup p{margin:6px 0;color:var(--text)}
#region-label{color:var(--text);font-size:.9rem;font-weight:700}
#r219-map-note{font-size:.8rem;margin:8px 0 2px}
#station-list{list-style:none;display:block;counter-reset:ampang-stop;max-height:min(43dvh,340px);overflow-y:auto;margin:12px 0;padding:0 5px 0 4px;background:linear-gradient(#A65100,#A65100) 19px 0/2px 100% no-repeat}
#station-list li{margin:0;min-height:39px}
#station-list li button{border:0;border-radius:0;background:transparent;min-height:42px;display:flex;align-items:center;padding:4px 2px;gap:11px;font-weight:570}
#station-list li button:focus-visible{outline:3px solid var(--focus)}
#station-list .num{flex:0 0 30px;max-width:30px;height:30px;background:#A65100;color:#fff;box-shadow:0 0 0 2px var(--card)}
#station-list li:first-child button,#station-list li:last-child button{font-weight:800}
:root[data-theme=dark] #r219-map .maplibregl-popup-content{background:#142e3e;color:#f3faff}
:root[data-theme=dark] #r219-map .maplibregl-popup-close-button{color:#f3faff}

<body><main>
<header><div><div class="eyebrow">P01 / R2.19 · ISOLATED DEVELOPMENT</div><h1 id="heading">LRT Ampang Line · Perkhidmatan 3</h1></div>
<div class="toolbar"><label for="lang">Language</label><select id="lang" aria-label="Language"><option value="ms">BM</option><option value="en">EN</option><option value="zh">中文</option><option value="th">ไทย</option></select><button id="theme" type="button">Dark Mode</button></div></header>
<div class="toolbar"><label id="region-label" for="r219-region">Kawasan peta</label><select id="r219-region" aria-label="Map region"><option value="malaysia">Malaysia</option><option value="thailand">Thailand</option><option value="china">China</option></select></div>
<div id="r219-map-shell"><div id="r219-map" role="region" aria-label="Interactive Railway-First map"></div>
<button type="button" id="r219-expand" aria-label="Expand map" aria-expanded="false">⛶</button></div>
<p id="r219-map-note" role="status" aria-live="polite">Peta vektor interaktif. Lokasi Ampang belum disahkan.</p>
<section><details open id="registry"><summary id="registry-title">LRT Ampang · 18 stesen</summary>
<p id="summary" class="stats"></p><ol id="station-list" aria-label="Ampang Line station sequence"></ol>
<p id="disclaimer" class="notice"></p><p class="notice"><span class="legend-line"></span><span id="legend-note"></span></p>
</details></section>
<dialog id="details"><h2 id="station-title"></h2><p id="station-code"></p><p id="station-shared"></p><p id="station-interchange"></p><p id="station-geometry"></p>
<p><a id="station-source" target="_blank" rel="noopener noreferrer">Source / Sumber</a></p>
<div class="close-row"><button type="button" id="close">Close / Tutup</button></div></dialog>
</main>
<script>
(function(){
'use strict';
const i18n={
 ms:{mapTitle:'Peta asas MR-S10 · rujukan umum',mapNote:'Titik biru ialah POI umum pada peta asal, bukan 18 stesen Ampang yang telah disahkan lokasinya. Peta ini mempunyai kawalan bahasa dan tema sendiri; geometri dan jajaran Ampang belum disahkan.',heading:'LRT Ampang Line · Perkhidmatan 3',registry:'LRT Ampang · 18 stesen',summary:'Sentul Timur → Ampang · 11 stesen bersama Sri Petaling',note:'Senarai stesen dan warna oren ialah identiti perkhidmatan; geometri landasan serta POI vektor masih BELUM DISAHKAN. Peta dalam bingkai ialah peta MR-S10 sedia ada, tanpa pewarnaan landasan Ampang.',orange:'Oren ialah kategori warna operator; kod heks tepat belum disahkan.',shared:'Perkhidmatan bersama: LRT Sri Petaling',branch:'Cabang Ampang selepas Chan Sow Lin',geometry:'Geometri fizikal: BELUM DISAHKAN',interchange:'Sambungan penumpang disokong sumber',other:'Tiada pengesahan pertukaran tambahan untuk rekod ini',source:'Buka bukti sumber',light:'Mod Cerah',dark:'Mod Gelap'},
 en:{mapTitle:'MR-S10 base map · general reference',mapNote:'Blue dots are generic POIs from the original map, not 18 geolocated Ampang stations. The base map has its own language and theme controls; Ampang physical alignment is unverified.',heading:'LRT Ampang Line · Service 3',registry:'LRT Ampang · 18 stations',summary:'Sentul Timur → Ampang · 11 stations shared with Sri Petaling',note:'Station list and orange colour denote passenger-service identity. Physical alignment and vector POIs remain UNVERIFIED. The embedded map is the existing MR-S10 map, without Ampang track recolouring.',orange:'Operator colour family is orange; an exact official hex is unverified.',shared:'Shared service: LRT Sri Petaling',branch:'Ampang branch beyond Chan Sow Lin',geometry:'Physical track geometry: UNVERIFIED',interchange:'Source-backed passenger connection',other:'No additional interchange evidence recorded',source:'Open source evidence',light:'Light Mode',dark:'Dark Mode'},
 zh:{mapTitle:'MR-S10 基础地图 · 普通参考',mapNote:'蓝色标记是原地图的普通兴趣点，并非已核实位置的安邦线18站。基础地图使用独立的语言与主题控制；实体线路尚未核实。',heading:'安邦轻轨线 · 3号线',registry:'安邦线 · 18个车站',summary:'Sentul Timur → Ampang · 与 Sri Petaling 共用11站',note:'橙色仅标识客运服务；实体轨道和矢量站点尚未核实。内嵌地图保持原样。站名保留经来源核实的英文写法。',orange:'运营商使用橙色；官方十六进制颜色尚未核实。',shared:'共用客运服务：Sri Petaling',branch:'Chan Sow Lin 后为 Ampang 支线',geometry:'实体轨道：未核实',interchange:'有来源支持的换乘',other:'暂无其他已验证换乘',source:'打开来源',light:'浅色模式',dark:'深色模式'},
 th:{mapTitle:'แผนที่พื้นฐาน MR-S10 · อ้างอิงทั่วไป',mapNote:'จุดสีน้ำเงินคือข้อมูลจุดสนใจทั่วไป ไม่ใช่ตำแหน่งสถานี Ampang ทั้ง 18 แห่งที่ยืนยันแล้ว แผนที่มีการตั้งค่าภาษาและธีมแยกต่างหาก ยังไม่ยืนยันแนวรางจริง',heading:'รถไฟฟ้าสาย Ampang · สาย 3',registry:'สาย Ampang · 18 สถานี',summary:'Sentul Timur → Ampang · ใช้ร่วมกับ Sri Petaling 11 สถานี',note:'สีส้มแสดงเอกลักษณ์บริการ ไม่ใช่แนวรางจริง ข้อมูลรางและจุดสถานีเวกเตอร์ยังไม่ยืนยัน แผนที่เดิมไม่ถูกเปลี่ยน ชื่อสถานีใช้ชื่อภาษาอังกฤษที่ตรวจสอบได้',orange:'ยืนยันเฉดสีส้ม แต่ยังไม่ยืนยันรหัสสีทางการ',shared:'บริการร่วมกับ Sri Petaling',branch:'แยกบริการไป Ampang หลัง Chan Sow Lin',geometry:'แนวรางจริง: ยังไม่ยืนยัน',interchange:'การเชื่อมต่อผู้โดยสารที่มีแหล่งอ้างอิง',other:'ไม่มีการยืนยันการเปลี่ยนสายเพิ่มเติม',source:'เปิดแหล่งอ้างอิง',light:'โหมดสว่าง',dark:'โหมดมืด'}
};
const api=window.MRS10AmpangR219;const el=id=>document.getElementById(id);if(!api||!api.validate()){el('summary').textContent='SOURCE REGISTRY ERROR';return}
let lang='ms';let active=null;let theme='light';
const set=(id,s)=>{el(id).textContent=s};
function render(){
 const l=i18n[lang];document.documentElement.lang=lang;set('heading',l.heading);set('registry-title',l.registry);set('summary',l.summary);set('disclaimer',l.note);set('legend-note',l.orange);
 set('theme',theme==='dark'?l.light:l.dark);const list=el('station-list');list.replaceChildren();
 for(const s of api.stations){
  const li=document.createElement('li'),btn=document.createElement('button'),num=document.createElement('span'),name=document.createElement('span'),code=document.createElement('span');
  btn.type='button';num.className='num';num.textContent=String(s.order);name.className='name';name.textContent=s.name;code.className='code';code.textContent=s.serviceCode;
  btn.setAttribute('aria-label',s.serviceCode+' '+s.name+(s.sharedPassengerService?' · shared with Sri Petaling':''));btn.append(num,name,code);if(s.sharedPassengerService){const shared=document.createElement('span');shared.className='shared-tag';shared.textContent='SP';shared.title='Shared passenger service · Sri Petaling';shared.setAttribute('aria-label','Shared with Sri Petaling');btn.append(shared)}btn.addEventListener('click',()=>showStation(s));
  li.append(btn);list.append(li);
 }
 if(active&&el('details').open)populate(active);
}
function populate(s){
 const l=i18n[lang];set('station-title',s.order+'/18 · '+s.name);set('station-code',s.serviceCode+' · '+s.id);
 set('station-shared',s.sharedPassengerService?l.shared:l.branch);set('station-interchange',s.interchangeEvidence?l.interchange+': '+s.interchangeEvidence.with.join(', '):l.other);
 set('station-geometry',l.geometry);
 const link=el('station-source');link.href=s.interchangeEvidence?.sourceUrl||api.sourceUrls.researchMap;link.textContent=l.source;
}
function showStation(s){active=s;populate(s);const d=el('details');if(!d.open)d.showModal()}
el('lang').addEventListener('change',e=>{if(i18n[e.target.value]){lang=e.target.value;render()}});
el('theme').addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;render();document.dispatchEvent(new Event('mrs10-r219-theme'))});
el('close').addEventListener('click',()=>el('details').close());
render();
})();
</script><script src="./assets/mrs10-r219-map-bridge.js" defer></script></body></html>
